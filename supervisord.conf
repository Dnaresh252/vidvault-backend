; ============================================
; 🔥 VIDVAULT SUPERVISOR CONFIGURATION
; Manages Cloudflare WARP + Node.js Application
; Production-Ready | Rank #1 Quality
; ============================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
user=root

; ============================================
; CLOUDFLARE WARP DAEMON
; ============================================
[program:warp-svc]
command=/bin/bash -c "mkdir -p /var/lib/cloudflare-warp && warp-svc"
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/var/log/warp/warp-svc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=10
user=root

; ============================================
; WARP CONNECTION SETUP
; ============================================
[program:warp-setup]
command=/app/start-warp.sh
autostart=true
autorestart=false
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/warp/warp-setup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=20
user=root
; Wait 5 seconds for warp-svc to start
startsecs=5

; ============================================
; NODE.JS APPLICATION
; ============================================
[program:nodejs]
command=node server.js
directory=/app
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
user=node
environment=NODE_ENV="production",WARP_PROXY_URL="socks5://127.0.0.1:40000",WARP_ENABLED="true"
; Wait 15 seconds for WARP to connect before starting Node.js
startsecs=15
; ============================================
; BGUTIL PO TOKEN SERVER
; ============================================
[program:bgutil-server]
command=npx --yes @imputnet/bgutil-ytdlp-pot-provider-server
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/bgutil.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=25
user=root
startsecs=5
; ============================================
; EVENT LISTENER (OPTIONAL - FOR MONITORING)
; ============================================
[eventlistener:processes]
command=/bin/bash -c "echo 'Supervisor running all processes'"
events=PROCESS_STATE